services:
  varnish:
    build: ../
    # Host port is assigned dynamically to avoid clashing with anything else
    # already listening locally. Tests discover it via `docker compose port`.
    ports:
      - 80
      # Prometheus exporter, covered by tests/metrics.test.ts
      - 9131
    extra_hosts:
      # The backend is not a container: it runs in the test process, on the
      # host, and is reached through the Docker host gateway.
      - "host.docker.internal:host-gateway"
    environment:
      - BACKEND_HOST=host.docker.internal
      # Set by global-setup.ts once the backend has picked a port. The stack is
      # therefore not meant to be started by hand.
      - BACKEND_PORT=${BACKEND_PORT:?run the stack through "npm test"}
      - CACHE_TTL=2s
      - PURGE_ACL=0.0.0.0/0
      - ENABLE_PROMETHEUS_EXPORTER=true
