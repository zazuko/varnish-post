# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for npm (root level)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for npm (integration tests)
  - package-ecosystem: "npm"
    directory: "/test"
    schedule:
      interval: "weekly"

  # Maintain dependencies for npm (test backend application)
  - package-ecosystem: "npm"
    directory: "/test/app"
    schedule:
      interval: "weekly"
    groups:
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
          - "@oxlint/*"
          - "@oxfmt/*"
      typescript:
        patterns:
          - "typescript"
      fastify:
        patterns:
          - "fastify"
          - "@fastify/*"
